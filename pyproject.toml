[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoopt"
version = "0.4.0"
description = "Distributed scientific software optimization trace factory for Harbor, OpenRouter (GLM-5.3), and Thinking Machines Tinker (Qwen3.5)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.44.9",
    "fastapi==0.165.0",
    "harbor==0.27.0",
    "httpx==0.28.1",
    "mlflow-skinny==3.18.0",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "scipy==1.18.1",
    "tinker==0.39.2",
    "tinker-cookbook==0.7.1",
    "torch==2.15.0",
    "transformers==5.24.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
repoopt = "repoopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoopt = ["bench/harness_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
