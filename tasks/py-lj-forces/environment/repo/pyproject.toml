[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ljforces"
version = "0.1.0"
description = "Reference 3D periodic Lennard-Jones 12-6 force and virial solver"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
